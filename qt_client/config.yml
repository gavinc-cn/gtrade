# GTrade Qt Client Configuration

# Desktop Gateway gRPC Configuration
desktop_gateway:
  # gRPC server address (host:port)
  server_address: "127.0.0.1:50051"

  # mTLS certificate paths (relative to working directory)
  ca_cert: "../../../../deploy/certs/ca.crt"
  client_cert: "../../../../deploy/certs/client.crt"
  client_key: "../../../../deploy/certs/client.key"

  # Connection settings
  connection_timeout_ms: 5000  # Connection timeout in milliseconds
  request_timeout_ms: 30000    # Request timeout in milliseconds

# HTTP Backend Configuration
http_backend:
  # Flask web_server REST API (required for data APIs)
  # Change this to your Windows host IP if running in Docker:
  # Example: http://127.0.0.1:46011
  web_server_url: http://127.0.0.1:46011

  # GTrade HTTP gateway (legacy, port 46012)
  gtrade_http_url: http://127.0.0.1:46012

# UI Settings
ui:
  # Theme: light, dark, auto
  theme: "auto"

  # Window settings
  window:
    width: 1280
    height: 800
    remember_size: true
    remember_position: true

  # Table settings
  table:
    page_size: 20  # Default page size for tables
    auto_refresh: true
    refresh_interval_ms: 5000  # Auto-refresh interval in milliseconds

# Logging
logging:
  enabled: true
  log_file: "log/gtrade_client.log"

  # Log levels to write to file (comma-separated)
  # Available levels: trace, debug, info, warn, error, critical
  # Example: "info,warn,error" will create separate log files for each level
  log_levels: "trace,info,warn,error"

  # Minimum level to show in console output
  # Available: trace, debug, info, warn, error, critical, off
  show_level: "info"

  max_files: 5
  max_size_mb: 10
