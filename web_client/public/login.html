<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GTrade 登录测试</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1e1e1e 0%, #2c2c2c 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 400px;
      padding: 40px;
      background: #353535;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
    }

    h1 {
      color: #409eff;
      text-align: center;
      margin-bottom: 30px;
      font-size: 36px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      color: #b0b0b0;
      margin-bottom: 8px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      font-size: 16px;
      color: #e0e0e0;
      background: #2a2a2a;
      border: 1px solid #4a4a4a;
      border-radius: 6px;
      outline: none;
    }

    input:focus {
      border-color: #409eff;
      border-width: 2px;
      padding: 11px 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      font-size: 16px;
      color: white;
      background: #409eff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #66b1ff;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 6px;
      text-align: center;
      display: none;
    }

    .error {
      background: rgba(245, 108, 108, 0.1);
      border: 1px solid #f56c6c;
      color: #f56c6c;
    }

    .success {
      background: rgba(103, 194, 58, 0.1);
      border: 1px solid #67c23a;
      color: #67c23a;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>GTrade</h1>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">用户名</label>
        <input
          type="text"
          id="username"
          name="username"
          value="admin"
          placeholder="请输入用户名"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">密码</label>
        <input
          type="password"
          id="password"
          name="password"
          value="admin"
          placeholder="请输入密码"
          required
        >
      </div>

      <button type="submit">登录</button>
    </form>

    <div id="message" class="message"></div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const messageDiv = document.getElementById('message');

      messageDiv.style.display = 'none';

      try {
        const response = await fetch('http://localhost:5000/api/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (data.success) {
          localStorage.setItem('token', data.token);
          messageDiv.className = 'message success';
          messageDiv.textContent = '登录成功！跳转中...';
          messageDiv.style.display = 'block';

          setTimeout(() => {
            window.location.href = '/#/strategy';
          }, 1000);
        } else {
          messageDiv.className = 'message error';
          messageDiv.textContent = data.message || '登录失败';
          messageDiv.style.display = 'block';
        }
      } catch (error) {
        messageDiv.className = 'message error';
        messageDiv.textContent = '网络错误: ' + error.message;
        messageDiv.style.display = 'block';
      }
    });

    // 测试输入框是否可用
    console.log('页面已加载');
    console.log('用户名输入框:', document.getElementById('username'));
    console.log('密码输入框:', document.getElementById('password'));
  </script>
</body>
</html>
